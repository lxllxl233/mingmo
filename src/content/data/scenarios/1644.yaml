description: 大顺据关中、大明据北方残局、清在关外、南明未立。三周之内决定天下。
player_hints:
  - 北京还能守多久，取决于山海关和吴三桂。
  - 大顺的追赃能立刻换来银子，也会立刻失去士绅。
  - 清入关不是必然，但关外的八旗不会等你。
