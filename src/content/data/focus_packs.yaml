focus_packs:
  # ══════════════════════════════════════════════════════
  # 大明：中枢 / 财政 / 辽事 / 民变 / 改革 / 南迁
  # ══════════════════════════════════════════════════════
  - country: MING
    exclusions:
      - [ming_court_2, ming_court_3]
      - [ming_fiscal_2, ming_fiscal_3]
      - [ming_liaodong_5, ming_liaodong_6]
      - [ming_rebellion_1, ming_rebellion_2]
      - [ming_reform_3, ming_reform_4]
    branches:
      - name: 中枢
        kind: court
        desc: 党争、厂卫与内阁，决定政令能否出得了京师。
        focuses:
          - { id: ming_court_1, name: 钦定逆案, tier: 0 }
          - { id: ming_court_2, name: 东林辅政, tier: 1 }
          - { id: ming_court_3, name: 复用厂卫, tier: 2 }
          - { id: ming_court_4, name: 内阁集权, tier: 3 }
          - { id: ming_court_5, name: 考成新法, tier: 4 }
          - { id: ming_court_6, name: 京察大计, tier: 5 }
          - { id: ming_court_7, name: 天子独断, tier: 6 }
      - name: 财政
        kind: reform
        desc: 太仓的窟窿不是税率问题，是税基被谁截留的问题。
        focuses:
          - { id: ming_fiscal_1, name: 整顿盐法, tier: 0 }
          - { id: ming_fiscal_2, name: 清丈田亩, tier: 1 }
          - { id: ming_fiscal_3, name: 加派辽饷, tier: 2 }
          - { id: ming_fiscal_4, name: 开海通商, tier: 3 }
          - { id: ming_fiscal_5, name: 裁撤宗禄, tier: 4 }
          - { id: ming_fiscal_6, name: 火耗归公, tier: 5 }
          - { id: ming_fiscal_7, name: 太仓重整, tier: 6 }
      - name: 辽事
        kind: military
        desc: 关宁锦防线、火器与和战，决定辽东是失血还是止血。
        focuses:
          - { id: ming_liaodong_1, name: 关宁锦防线, tier: 0 }
          - { id: ming_liaodong_2, name: 练新军, tier: 1 }
          - { id: ming_liaodong_3, name: 火器局, tier: 2 }
          - { id: ming_liaodong_4, name: 联蒙抗金, tier: 3 }
          - { id: ming_liaodong_5, name: 与清议和, tier: 4 }
          - { id: ming_liaodong_6, name: 决战辽东, tier: 5 }
          - { id: ming_liaodong_7, name: 收复辽沈, tier: 6, desc: '辽沈是辽东的根，不是一次野战能拿回来的。此策要求明军已经控制沈阳、辽阳等核心地区，才把军事占领转为正式收复；否则只能继续围困。', grants: [shenyang], annexes: [shenyang] }
      - name: 民变
        kind: court
        desc: 剿与抚不是道德选择，是财政与时间的交换。
        focuses:
          - { id: ming_rebellion_1, name: 剿寇, tier: 0 }
          - { id: ming_rebellion_2, name: 招抚, tier: 1 }
          - { id: ming_rebellion_3, name: 以寇制寇, tier: 2 }
          - { id: ming_rebellion_4, name: 赈济陕甘, tier: 3 }
          - { id: ming_rebellion_5, name: 裁驿并站, tier: 4 }
          - { id: ming_rebellion_6, name: 团练乡勇, tier: 5 }
          - { id: ming_rebellion_7, name: 平定流寇, tier: 6 }
      - name: 改革
        kind: reform
        desc: 迁都、死守、罪己与新政，都是在给社稷续命。
        focuses:
          - { id: ming_reform_1, name: 一条鞭深化, tier: 0 }
          - { id: ming_reform_2, name: 考成法, tier: 1 }
          - { id: ming_reform_3, name: 迁都南京, tier: 2 }
          - { id: ming_reform_4, name: 死守京师, tier: 3 }
          - { id: ming_reform_5, name: 罪己诏, tier: 4 }
          - { id: ming_reform_6, name: 士绅一体当差, tier: 5 }
          - { id: ming_reform_7, name: 新政全局, tier: 6 }
      - name: 南迁
        kind: navy
        desc: 漕运、江防与海路，是京师与江南之间的命脉。
        focuses:
          - { id: ming_south_1, name: 南京备荒, tier: 0 }
          - { id: ming_south_2, name: 漕运改海运, tier: 1 }
          - { id: ming_south_3, name: 江防, tier: 2 }
          - { id: ming_south_4, name: 闽粤海防, tier: 3 }
          - { id: ming_south_5, name: 联郑氏, tier: 4 }
          - { id: ming_south_6, name: 借葡师, tier: 5 }
          - { id: ming_south_7, name: 南渡续命, tier: 6 }

  # ══════════════════════════════════════════════════════
  # 大清：八旗 / 汉化 / 入关 / 藩部 / 海疆 / 内政
  # ══════════════════════════════════════════════════════
  - country: QING
    exclusions:
      - [qing_han_1, qing_han_5]
      - [qing_coast_1, qing_coast_6]
      - [qing_domestic_1, qing_domestic_2]
    branches:
      - name: 八旗
        kind: military
        barrier: false
        desc: 八旗是清的根本，也是清的人口天花板。
        focuses:
          - { id: qing_banner_1, name: 牛录编审, tier: 0, desc: '牛录是八旗的基层军政组织，兼管户籍、兵役与旗地。编审牛录，就是清查壮丁、核定旗籍、重分旗地，把散居的部民固定为可征调的八旗户口；做得成，八旗兵源与军心都会更稳，但也会加深满汉土地矛盾。' }
          - { id: qing_banner_2, name: 旗地扩张, tier: 1, desc: '旗地是八旗兵丁的生计，也是清朝入关前后最敏感的土地问题。扩张旗地意味着把辽西、北直隶的汉地划归旗人，短期能稳住八旗，长期会激化满汉冲突。', grants: [guangning] }
          - { id: qing_banner_3, name: 蒙古八旗, tier: 2 }
          - { id: qing_banner_4, name: 汉军八旗, tier: 3 }
          - { id: qing_banner_5, name: 火器营, tier: 4 }
          - { id: qing_banner_6, name: 八旗劲旅, tier: 5 }
          - { id: qing_banner_7, name: 满洲根本, tier: 6 }
      - name: 汉化
        kind: court
        desc: 满汉一体还是首崇满洲，决定清能不能坐稳天下。
        focuses:
          - { id: qing_han_1, name: 满汉一体, tier: 0 }
          - { id: qing_han_2, name: 开科取士, tier: 1 }
          - { id: qing_han_3, name: 任用汉官, tier: 2 }
          - { id: qing_han_4, name: 整顿吏治, tier: 3 }
          - { id: qing_han_5, name: 首崇满洲, tier: 4 }
          - { id: qing_han_6, name: 剃发易服, tier: 5 }
          - { id: qing_han_7, name: 大一统之制, tier: 6 }
      - name: 入关
        kind: military
        desc: 山海关是天下第一关，也是清唯一的机会窗口。
        focuses:
          - { id: qing_entry_1, name: 联蒙入塞, tier: 0 }
          - { id: qing_entry_2, name: 招降吴三桂, tier: 1 }
          - { id: qing_entry_3, name: 山海关决战, tier: 2 }
          - { id: qing_entry_4, name: 定鼎北京, tier: 3, desc: '定鼎北京不是换一面旗，而是接管明朝的京师、官僚与仓场。只有实际控制北京及其周边，才能把占领变成正式版图与统治中心；否则只是又一次入塞。', grants: [beijing], annexes: [beijing] }
          - { id: qing_entry_5, name: 南下追击, tier: 4 }
          - { id: qing_entry_6, name: 平定江南, tier: 5 }
          - { id: qing_entry_7, name: 一统天下, tier: 6 }
      - name: 藩部
        kind: diplomacy
        desc: 盟旗、联姻与征讨，决定草原是屏障还是伤口。
        focuses:
          - { id: qing_vassal_1, name: 盟旗制度, tier: 0 }
          - { id: qing_vassal_2, name: 联姻科尔沁, tier: 1 }
          - { id: qing_vassal_3, name: 征讨察哈尔, tier: 2 }
          - { id: qing_vassal_4, name: 收服西藏, tier: 3 }
          - { id: qing_vassal_5, name: 朝鲜属国, tier: 4 }
          - { id: qing_vassal_6, name: 准噶尔交往, tier: 5 }
          - { id: qing_vassal_7, name: 藩部共主, tier: 6 }
      - name: 海疆
        kind: navy
        desc: 海禁与迁界能断绝郑氏，也会断绝自己的关税。
        focuses:
          - { id: qing_coast_1, name: 海禁, tier: 0 }
          - { id: qing_coast_2, name: 迁界, tier: 1 }
          - { id: qing_coast_3, name: 水师建设, tier: 2 }
          - { id: qing_coast_4, name: 招降郑氏, tier: 3 }
          - { id: qing_coast_5, name: 平台之役, tier: 4 }
          - { id: qing_coast_6, name: 开海贸易, tier: 5 }
          - { id: qing_coast_7, name: 海疆一统, tier: 6 }
      - name: 内政
        kind: economy
        desc: 圈地、更名田与漕运，是清在汉地的财政地基。
        focuses:
          - { id: qing_domestic_1, name: 圈地, tier: 0 }
          - { id: qing_domestic_2, name: 更名田, tier: 1 }
          - { id: qing_domestic_3, name: 摊丁入亩, tier: 2 }
          - { id: qing_domestic_4, name: 盐法, tier: 3 }
          - { id: qing_domestic_5, name: 漕运, tier: 4 }
          - { id: qing_domestic_6, name: 人参贸易, tier: 5 }
          - { id: qing_domestic_7, name: 盛京本位, tier: 6 }

  # ══════════════════════════════════════════════════════
  # 大顺：追赃 / 建制 / 招抚 / 东征 / 流民 / 军制
  # ══════════════════════════════════════════════════════
  - country: SHUN
    exclusions:
      - [shun_confiscate_1, shun_confiscate_4]
      - [shun_refugee_1, shun_refugee_5]
      - [shun_recruit_4, shun_east_4]
    branches:
      - name: 追赃
        kind: economy
        desc: 追赃能立刻换来军饷，也会立刻失去士绅。
        focuses:
          - { id: shun_confiscate_1, name: 追赃助饷, tier: 0 }
          - { id: shun_confiscate_2, name: 拷掠明官, tier: 1 }
          - { id: shun_confiscate_3, name: 没收藩产, tier: 2 }
          - { id: shun_confiscate_4, name: 均田免赋, tier: 3 }
          - { id: shun_confiscate_5, name: 设官理民, tier: 4 }
          - { id: shun_confiscate_6, name: 铸钱, tier: 5 }
          - { id: shun_confiscate_7, name: 财政自立, tier: 6 }
      - name: 建制
        kind: court
        desc: 从流寇到朝廷，缺的不是名号，是官僚与税册。
        focuses:
          - { id: shun_state_1, name: 西安称帝, tier: 0 }
          - { id: shun_state_2, name: 设六政府, tier: 1 }
          - { id: shun_state_3, name: 开科取士, tier: 2 }
          - { id: shun_state_4, name: 招降明将, tier: 3 }
          - { id: shun_state_5, name: 整肃军纪, tier: 4 }
          - { id: shun_state_6, name: 定都西安, tier: 5 }
          - { id: shun_state_7, name: 大顺正朔, tier: 6 }
      - name: 招抚
        kind: diplomacy
        desc: 招抚是给对手一条生路，也是给自己埋一条后路。
        focuses:
          - { id: shun_recruit_1, name: 招抚左良玉, tier: 0 }
          - { id: shun_recruit_2, name: 联络南明, tier: 1 }
          - { id: shun_recruit_3, name: 结好蒙古, tier: 2 }
          - { id: shun_recruit_4, name: 招降吴三桂, tier: 3 }
          - { id: shun_recruit_5, name: 安抚士绅, tier: 4 }
          - { id: shun_recruit_6, name: 减免赋税, tier: 5 }
          - { id: shun_recruit_7, name: 天下归心, tier: 6 }
      - name: 东征
        kind: military
        desc: 从西安到北京，速度是大顺唯一的本钱。
        focuses:
          - { id: shun_east_1, name: 渡河东征, tier: 0 }
          - { id: shun_east_2, name: 破太原, tier: 1 }
          - { id: shun_east_3, name: 取北京, tier: 2, desc: '北京是明朝的心脏，也是大顺从流寇转为朝廷的门槛。此策只在已经控制北京后才正式接管顺天府，否则仍是口号。', grants: [beijing], annexes: [beijing] }
          - { id: shun_east_4, name: 山海关, tier: 3 }
          - { id: shun_east_5, name: 追亡逐北, tier: 4 }
          - { id: shun_east_6, name: 据守山西, tier: 5 }
          - { id: shun_east_7, name: 北伐辽东, tier: 6 }
      - name: 流民
        kind: reform
        desc: 流民是兵源，也是税基；安置不好，两者都会反噬。
        focuses:
          - { id: shun_refugee_1, name: 流民屯田, tier: 0 }
          - { id: shun_refugee_2, name: 赈济饥民, tier: 1 }
          - { id: shun_refugee_3, name: 编户齐民, tier: 2 }
          - { id: shun_refugee_4, name: 裁撤冗官, tier: 3 }
          - { id: shun_refugee_5, name: 军屯, tier: 4 }
          - { id: shun_refugee_6, name: 盐课, tier: 5 }
          - { id: shun_refugee_7, name: 恢复生产, tier: 6 }
      - name: 军制
        kind: military
        desc: 老营的战斗力来自流民，也来自没有退路。
        focuses:
          - { id: shun_army_1, name: 老营整编, tier: 0 }
          - { id: shun_army_2, name: 骑兵扩张, tier: 1 }
          - { id: shun_army_3, name: 火器缴获, tier: 2 }
          - { id: shun_army_4, name: 三堵墙战术, tier: 3 }
          - { id: shun_army_5, name: 军纪, tier: 4 }
          - { id: shun_army_6, name: 粮道, tier: 5 }
          - { id: shun_army_7, name: 百万之众, tier: 6 }

  # ══════════════════════════════════════════════════════
  # 大西：入川 / 屯垦 / 联明 / 出川 / 恐怖 / 治理
  # ══════════════════════════════════════════════════════
  - country: XI
    exclusions:
      - [xi_ming_1, xi_expand_1]
      - [xi_terror_1, xi_govern_1]
    branches:
      - name: 入川
        kind: military
        desc: 四川四面皆山，守住是基业，守不住是坟墓。
        focuses:
          - { id: xi_sichuan_1, name: 据成都, tier: 0, desc: '成都是四川的粮仓与政治中心。只有实际控制成都及其属县，才能把大西军的流动作战变成以蜀为基业的割据。', grants: [chengdu], annexes: [chengdu] }
          - { id: xi_sichuan_2, name: 取重庆, tier: 1 }
          - { id: xi_sichuan_3, name: 定川西, tier: 2 }
          - { id: xi_sichuan_4, name: 征川南, tier: 3 }
          - { id: xi_sichuan_5, name: 土司归附, tier: 4 }
          - { id: xi_sichuan_6, name: 粮道, tier: 5 }
          - { id: xi_sichuan_7, name: 全蜀, tier: 6 }
      - name: 屯垦
        kind: economy
        desc: 粮尽则国亡，四川的田是最好的兵工厂。
        focuses:
          - { id: xi_colony_1, name: 军屯, tier: 0 }
          - { id: xi_colony_2, name: 民屯, tier: 1 }
          - { id: xi_colony_3, name: 招抚流民, tier: 2 }
          - { id: xi_colony_4, name: 修都江堰, tier: 3 }
          - { id: xi_colony_5, name: 盐井, tier: 4 }
          - { id: xi_colony_6, name: 铸钱, tier: 5 }
          - { id: xi_colony_7, name: 天府之富, tier: 6 }
      - name: 联明
        kind: diplomacy
        desc: 联明不是忠义，是两面受敌时唯一的下注。
        focuses:
          - { id: xi_ming_1, name: 联南明, tier: 0 }
          - { id: xi_ming_2, name: 抗清, tier: 1 }
          - { id: xi_ming_3, name: 联络大顺, tier: 2 }
          - { id: xi_ming_4, name: 结好土司, tier: 3 }
          - { id: xi_ming_5, name: 借师, tier: 4 }
          - { id: xi_ming_6, name: 称藩, tier: 5 }
          - { id: xi_ming_7, name: 共保西南, tier: 6 }
      - name: 出川
        kind: military
        desc: 出川是豪赌，赢了争天下，输了连四川也回不去。
        focuses:
          - { id: xi_expand_1, name: 出汉中, tier: 0 }
          - { id: xi_expand_2, name: 取西安, tier: 1 }
          - { id: xi_expand_3, name: 东下荆襄, tier: 2 }
          - { id: xi_expand_4, name: 北伐, tier: 3 }
          - { id: xi_expand_5, name: 入滇, tier: 4 }
          - { id: xi_expand_6, name: 图黔, tier: 5 }
          - { id: xi_expand_7, name: 争天下, tier: 6 }
      - name: 恐怖
        kind: unique
        modifier: { estate_loyalty_monthly: -0.08, army_attack_pct: 4 }
        desc: 以杀立威最快，也最快把人心杀光。
        focuses:
          - { id: xi_terror_1, name: 严刑, tier: 0 }
          - { id: xi_terror_2, name: 屠戮, tier: 1 }
          - { id: xi_terror_3, name: 立威, tier: 2 }
          - { id: xi_terror_4, name: 清洗, tier: 3 }
          - { id: xi_terror_5, name: 恐怖统治, tier: 4 }
          - { id: xi_terror_6, name: 人人自危, tier: 5 }
          - { id: xi_terror_7, name: 以杀止乱, tier: 6 }
      - name: 治理
        kind: reform
        desc: 从杀人到治人，大西必须跨过的一道坎。
        focuses:
          - { id: xi_govern_1, name: 设官, tier: 0 }
          - { id: xi_govern_2, name: 科举, tier: 1 }
          - { id: xi_govern_3, name: 均田, tier: 2 }
          - { id: xi_govern_4, name: 轻徭, tier: 3 }
          - { id: xi_govern_5, name: 安民, tier: 4 }
          - { id: xi_govern_6, name: 恢复, tier: 5 }
          - { id: xi_govern_7, name: 蜀人归心, tier: 6 }

  # ══════════════════════════════════════════════════════
  # 南明：正统 / 联寇 / 联海 / 西南 / 藩镇 / 财政
  # ══════════════════════════════════════════════════════
  - country: SMING
    exclusions:
      - [sming_bandit_1, sming_bandit_5]
      - [sming_warlord_1, sming_warlord_4]
    branches:
      - name: 正统
        kind: court
        desc: 正统是南明最大的资产，也是最大的负债。
        focuses:
          - { id: sming_legit_1, name: 弘光继统, tier: 0 }
          - { id: sming_legit_2, name: 隆武, tier: 1 }
          - { id: sming_legit_3, name: 永历, tier: 2 }
          - { id: sming_legit_4, name: 正统之争, tier: 3 }
          - { id: sming_legit_5, name: 追尊, tier: 4 }
          - { id: sming_legit_6, name: 玉玺, tier: 5 }
          - { id: sming_legit_7, name: 天下共主, tier: 6 }
      - name: 联寇
        kind: diplomacy
        desc: 联寇抗清还是借虏平寇，决定南明死在谁手里。
        focuses:
          - { id: sming_bandit_1, name: 联顺抗清, tier: 0 }
