events:
  # ── 大明 ───────────────────────────────────────────────────────
  - id: MING_e_shaanxi_drought
    title: 陕西大旱
    desc: 陕西连年大旱，饥民揭竿。赈济能缓一时，加派能补辽饷却会逼反更多人。
    historical_context: 1628–1630 年陕西大旱，王嘉胤、高迎祥等起事，明末农民战争爆发。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1628-01-01, before: 1631-12-31 }
    mtth: 100
    fire_once: true
    options:
      - id: relieve
        name: 开仓赈济
        tooltip: 稳定上升，粮银消耗。
        ai_chance: 50
        effect:
          - add_treasury: -40000
          - add_food: -80000
          - add_stability: 3
          - add_faction_influence: { donglin: 3 }
      - id: tax
        name: 加派辽饷
        tooltip: 得银，稳定与民心受损。
        ai_chance: 50
        effect:
          - add_treasury: 60000
          - add_stability: -4
          - add_corruption: 2

  - id: MING_e_yuan_case
    title: 袁崇焕案
    desc: 己巳之变后，袁崇焕下狱。杀能立威，赦能保边将之心。
    historical_context: 1630 年袁崇焕被凌迟，辽东边将人人自危。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1630-01-01, before: 1631-12-31 }
    mtth: 80
    fire_once: true
    options:
      - id: execute
        name: 处死袁崇焕
        tooltip: 皇权与厂卫支持上升，军心受损。
        ai_chance: 55
        effect:
          - add_authority: 3
          - add_army_loyalty: -4
          - add_faction_influence: { eunuch: 4, military: -4 }
      - id: pardon
        name: 宽宥边将
        tooltip: 军心上升，皇权受损。
        ai_chance: 45
        effect:
          - add_army_loyalty: 4
          - add_stability: 1
          - add_faction_influence: { military: 5, eunuch: -3 }

  - id: MING_e_kaifeng
    title: 开封之围
    desc: 李自成围开封，城中粮尽。救援能保中原，放弃能存兵力。
    historical_context: 1642 年开封被围，明军掘黄河灌城，城中死者无数。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1642-01-01, before: 1643-06-30 }
    mtth: 80
    fire_once: true
    options:
      - id: relieve
        name: 发兵救援
        tooltip: 稳定上升，兵力与国库消耗。
        ai_chance: 50
        effect:
          - add_treasury: -60000
          - add_manpower: -4000
          - add_stability: 2
      - id: abandon
        name: 放弃开封
        tooltip: 保存兵力，天命与稳定受损。
        ai_chance: 50
        effect:
          - add_stability: -3
          - add_mandate: -4
          - add_army_loyalty: 2

  # ── 大清 ───────────────────────────────────────────────────────
  - id: QING_e_mongol_submission
    title: 蒙古归附
    desc: 漠南蒙古诸部来附。编入盟旗能直接征兵，保留部族能省治理成本。
    historical_context: 1635 年后漠南蒙古诸部归附后金，成为八旗蒙古与盟旗体系的一部分。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1635-01-01, before: 1640-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: integrate
        name: 编入盟旗
        tooltip: 兵源与八旗支持上升，耗费银两。
        ai_chance: 55
        effect:
          - add_manpower: 3000
          - add_treasury: -30000
          - add_faction_influence: { banners: 4, manchu: 2 }
      - id: autonomy
        name: 保留部族
        tooltip: 稳定上升，兵源较少。
        ai_chance: 45
        effect:
          - add_stability: 2
          - add_manpower: 1000
          - add_faction_influence: { imperial: 3 }

  - id: QING_e_capital_move
    title: 入关定鼎
    desc: 北京已下，是迁都北京，还是留守盛京？迁都能控中原，留守能保根本。
    historical_context: 1644 年多尔衮迎顺治迁都北京，正式确立清朝对全国的统治。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1644-06-01, before: 1645-06-30 }
    mtth: 50
    fire_once: true
    options:
      - id: move
        name: 迁都北京
        tooltip: 正统与皇权上升，八旗贵胄不满。
        ai_chance: 60
        effect:
          - add_mandate: 5
          - add_authority: 3
          - add_faction_influence: { imperial: 4, banners: -3 }
      - id: stay
        name: 留守盛京
        tooltip: 八旗支持，正统受损。
        ai_chance: 40
        effect:
          - add_faction_influence: { banners: 5 }
          - add_mandate: -4
          - add_stability: 1

  - id: QING_e_three_feudatories
    title: 三藩之乱
    desc: 吴三桂起兵，三藩响应。削藩能除后患，安抚能暂息兵戈。
    historical_context: 1673 年三藩之乱爆发，历时八年，是清朝前期最大内战。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1673-01-01, before: 1678-12-31 }
    mtth: 60
    fire_once: true
    options:
      - id: crush
        name: 坚决削藩
        tooltip: 皇权与八旗支持上升，稳定与国库受损。
        ai_chance: 60
        effect:
          - add_authority: 4
          - add_stability: -3
          - add_treasury: -80000
          - add_faction_influence: { banners: 4, green_standard: -3 }
      - id: appease
        name: 安抚三藩
        tooltip: 稳定上升，皇权受损。
        ai_chance: 40
        effect:
          - add_stability: 2
          - add_treasury: -30000
          - add_authority: -3

  # ── 大顺 ───────────────────────────────────────────────────────
  - id: SHUN_e_henan_famine
    title: 河南饥民
    desc: 河南大饥，饥民求大顺开仓。开仓能得民心，就食能保军粮。
    historical_context: 大顺军在河南以“迎闯王，不纳粮”争取饥民，军粮始终紧张。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1640-01-01, before: 1643-12-31 }
    mtth: 100
    fire_once: true
    options:
      - id: open_granary
        name: 开仓放粮
        tooltip: 农民支持、稳定上升，粮储下降。
        ai_chance: 55
        effect:
          - add_food: -60000
          - add_stability: 3
          - add_faction_influence: { farmers: 5 }
      - id: feed_army
        name: 先保军粮
        tooltip: 军心上升，农民失望。
        ai_chance: 45
        effect:
          - add_army_loyalty: 3
          - add_faction_influence: { military: 3, farmers: -4 }

  - id: SHUN_e_shanhaiguan
    title: 山海关之战
    desc: 吴三桂拒降，清军压境。决战能定天下，退守能保实力。
    historical_context: 1644 年山海关之战，大顺军被清吴联军击败，退出北京。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1644-04-15, before: 1644-06-30 }
    mtth: 40
    fire_once: true
    options:
      - id: fight
        name: 决战山海关
        tooltip: 孤注一掷，军心上升，但败则弃京西走。
        ai_chance: 55
        effect:
          - add_manpower: -5000
          - add_stability: -4
          - add_army_loyalty: 3
          - set_flag: shun_fought_shanhaiguan
      - id: retreat
        name: 退守北京
        tooltip: 保存兵力，天命受损，却可保实力转进。
        ai_chance: 45
        effect:
          - add_mandate: -5
          - add_stability: -2
          - add_manpower: -1000
          - set_flag: shun_retreated_shanhaiguan

  # 山海关的长期后果：决战若败 → 弃京西走（更惨）；退守 → 保存实力（转进陕甘）。
  - id: SHUN_e_leave_beijing
    title: 弃守北京
    desc: 山海关大败，清吴联军长驱直入，大顺被迫退出北京，一路西走。
    historical_context: 1644 年山海关战败后，李自成匆匆在北京称帝即弃城西走。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1644-07-01, before: 1646-12-31 }
        - has_flag: shun_fought_shanhaiguan
    mtth: 120
    fire_once: true
    options:
      - id: flee_west
        name: 弃京西走
        tooltip: 都城失守，天命与军心大损。
        ai_chance: 60
        effect:
          - add_stability: -4
          - add_mandate: -6
          - add_manpower: -8000
          - add_treasury: -60000
      - id: hold_city
        name: 死守京师
        tooltip: 与城共存亡，损失更重。
        ai_chance: 40
        effect:
          - add_manpower: -12000
          - add_stability: -6
          - add_army_loyalty: 3

  - id: SHUN_e_preserve_army
    title: 保存实力
    desc: 大顺主动退出北京，保住了主力，转进陕甘，尚有再战之力。
    historical_context: 若李自成不战而退，大顺军主力尚存，或可在陕甘与清军周旋更久。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1644-07-01, before: 1646-12-31 }
        - has_flag: shun_retreated_shanhaiguan
    mtth: 120
    fire_once: true
    options:
      - id: westward
        name: 转进陕甘
        tooltip: 保存兵力，天命受损但元气未失。
        ai_chance: 60
        effect:
          - add_manpower: 5000
          - add_army_loyalty: 2
          - add_mandate: -3
      - id: retake
        name: 回师再战
        tooltip: 冒险反扑，胜负难料。
        ai_chance: 40
        effect:
          - add_manpower: -3000
          - add_stability: -2
          - add_army_loyalty: 4

  - id: SHUN_e_ming_alliance
    title: 联明抗清
    desc: 清军入关后，大顺余部面临选择：联明抗清，还是独立作战。
    historical_context: 1645 年后大顺余部与南明联合抗清，形成夔东十三家等势力。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1645-01-01, before: 1650-12-31 }
    mtth: 90
    fire_once: true
    options:
      - id: ally
        name: 联明抗清
        tooltip: 对南明关系上升，正统与军心上升。
        ai_chance: 55
        effect:
          - add_relation: { target: SMING, value: 20 }
          - add_mandate: 2
          - add_army_loyalty: 2
          - add_faction_influence: { military: 3 }
      - id: alone
        name: 独立作战
        tooltip: 稳定上升，外交孤立。
        ai_chance: 45
        effect:
          - add_stability: 1
          - add_relation: { target: SMING, value: -10 }
          - add_faction_influence: { farmers: 2 }

  # ── 南明 ───────────────────────────────────────────────────────
  - id: SMING_e_zuo_liangyu
    title: 左良玉东下
    desc: 左良玉以清君侧为名东下南京。拦截会内战，安抚会纵容军阀。
    historical_context: 1645 年左良玉东下，弘光朝调江北四镇迎击，清军乘虚南下。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1645-03-01, before: 1645-06-30 }
    mtth: 40
    fire_once: true
    options:
      - id: block
        name: 发兵拦截
        tooltip: 稳定上升，兵力与武将支持受损。
        ai_chance: 50
        effect:
          - add_manpower: -3000
          - add_stability: 1
          - add_faction_influence: { military: -4 }
      - id: appease
        name: 下诏安抚
        tooltip: 武将支持，稳定下降。
        ai_chance: 50
        effect:
          - add_faction_influence: { military: 4 }
          - add_stability: -2
          - add_corruption: 1

  - id: SMING_e_yangzhou
    title: 扬州十日
    desc: 清军围扬州，史可法死守。死守能全气节，撤退能保军民。
    historical_context: 1645 年扬州陷落，清军屠城，史称扬州十日。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1645-04-01, before: 1645-06-30 }
    mtth: 40
    fire_once: true
    options:
      - id: hold
        name: 死守扬州
        tooltip: 正统与稳定上升，兵力重创。
        ai_chance: 55
        effect:
          - add_mandate: 4
          - add_stability: 2
          - add_manpower: -5000
          - add_army_loyalty: 3
      - id: evacuate
        name: 撤离军民
        tooltip: 保存兵力，正统受损。
        ai_chance: 45
        effect:
          - add_manpower: -1000
          - add_mandate: -4
          - add_stability: -1

  - id: SMING_e_curse_water
    title: 咒水之难
    desc: 永历帝入缅，缅王邀群臣饮咒水。赴约可能被扣，不去则失外援。
    historical_context: 1661 年咒水之难，南明大臣被缅方杀害，永历帝随后被俘。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1661-01-01, before: 1662-06-30 }
    mtth: 50
    fire_once: true
    options:
      - id: attend
        name: 赴咒水之约
        tooltip: 正统受损，外交关系变化。
        ai_chance: 50
        effect:
          - add_mandate: -3
          - add_stability: -2
          - add_relation: { target: QING, value: -5 }
      - id: refuse
        name: 拒绝赴约
        tooltip: 稳定上升，外援断绝。
        ai_chance: 50
        effect:
          - add_stability: 1
          - add_treasury: -20000
          - add_faction_influence: { military: 2 }

  # ── 郑氏 ───────────────────────────────────────────────────────
  - id: ZHENG_e_xiamen_base
    title: 金厦基地
    desc: 金门、厦门是郑氏根本。固守能保海贸，转移能避清军锋芒。
    historical_context: 郑氏以金厦为基地，多次击退清军，直到 1663 年失守。
    scope: country
    country: ZHENG
    trigger:
      all:
        - date: { after: 1650-01-01, before: 1663-12-31 }
    mtth: 100
    fire_once: true
    options:
      - id: hold
        name: 固守金厦
        tooltip: 稳定与商人支持上升。
        ai_chance: 55
        effect:
          - add_stability: 2
          - add_faction_influence: { merchants: 4 }
          - add_treasury: 20000
      - id: relocate
        name: 转移台湾
        tooltip: 保存实力，稳定受损。
        ai_chance: 45
        effect:
          - add_stability: -1
          - add_manpower: 2000
          - add_treasury: -30000

  - id: ZHENG_e_luzon
    title: 吕宋华侨
    desc: 西班牙人在吕宋迫害华侨，郑氏要不要出兵保护？
    historical_context: 1662 年郑成功遣使吕宋，要求西班牙人保护华侨，未果。
    scope: country
    country: ZHENG
    trigger:
      all:
        - date: { after: 1662-01-01, before: 1665-12-31 }
    mtth: 90
    fire_once: true
    options:
      - id: protect
        name: 出兵护侨
        tooltip: 商人支持、正统上升，耗费军力。
        ai_chance: 50
        effect:
          - add_faction_influence: { merchants: 5 }
          - add_mandate: 2
          - add_manpower: -2000
          - add_treasury: -30000
      - id: ignore
        name: 暂不干预
        tooltip: 保存军力，商人失望。
        ai_chance: 50
        effect:
          - add_treasury: 10000
          - add_faction_influence: { merchants: -4 }

  - id: ZHENG_e_penghu
    title: 澎湖海战
    desc: 施琅率清军水师攻澎湖。决战能保台湾，撤退能保舰队。
    historical_context: 1683 年澎湖海战，郑军主力覆没，台湾随后归清。
    scope: country
    country: ZHENG
    trigger:
      all:
        - date: { after: 1683-01-01, before: 1683-12-31 }
    mtth: 30
    fire_once: true
    options:
      - id: fight
        name: 决战澎湖
        tooltip: 军心上升，舰队重创。
        ai_chance: 55
        effect:
          - add_army_loyalty: 3
          - add_manpower: -4000
          - add_stability: -2
      - id: withdraw
        name: 退守台湾
        tooltip: 保存舰队，稳定受损。
        ai_chance: 45
        effect:
          - add_stability: -1
          - add_manpower: -1000
          - add_faction_influence: { military: -3 }

  # ── 蒙古 ───────────────────────────────────────────────────────
  - id: MONGOL_e_oirat_alliance
    title: 卫拉特联盟
    desc: 卫拉特诸部遣使请求会盟。结盟能抗后金，独立能保牧场。
    historical_context: 17 世纪卫拉特与喀尔喀会盟，试图对抗东蒙古与后金。
    scope: country
    country: MONGOL
    trigger:
      all:
        - date: { after: 1630-01-01, before: 1645-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: ally
        name: 结盟卫拉特
        tooltip: 兵源与汗权上升，耗费银两。
        ai_chance: 50
        effect:
          - add_manpower: 2000
          - add_mandate: 3
          - add_treasury: -20000
      - id: independent
        name: 保持独立
        tooltip: 稳定上升，兵源较少。
        ai_chance: 50
        effect:
          - add_stability: 2
          - add_faction_influence: { nobles: 2 }

  - id: MONGOL_e_monastery
    title: 藏传寺院
    desc: 格鲁派请求扩建寺院。供养能得喇嘛支持，限制能保牧场与人口。
    historical_context: 藏传佛教在蒙古社会影响巨大，寺院经济与人口问题长期存在。
    scope: country
    country: MONGOL
    trigger:
      all:
        - date: { after: 1640-01-01, before: 1660-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: patronize
        name: 供养寺院
        tooltip: 喇嘛与稳定上升，耗费银两。
        ai_chance: 50
        effect:
          - add_faction_influence: { clergy: 6 }
          - add_stability: 2
          - add_treasury: -20000
      - id: limit
        name: 限制寺院
        tooltip: 兵源与贵族支持上升，喇嘛不满。
        ai_chance: 50
        effect:
          - add_faction_influence: { clergy: -4, nobles: 3 }
          - add_manpower: 1000

  - id: MONGOL_e_pasture
    title: 漠南牧场
    desc: 漠南草场被后金与汉人开垦。南迁能保牧场，北守能避冲突。
    historical_context: 清初在漠南推行盟旗与农垦，蒙古牧场不断收缩。
    scope: country
    country: MONGOL
    trigger:
      all:
        - date: { after: 1645-01-01, before: 1665-12-31 }
    mtth: 130
    fire_once: true
    options:
      - id: move_south
        name: 南迁牧场
        tooltip: 兵源与稳定上升，与清关系紧张。
        ai_chance: 45
        effect:
          - add_manpower: 2000
          - add_stability: 1
          - add_relation: { target: QING, value: -10 }
      - id: move_north
        name: 北守故地
        tooltip: 稳定上升，兵源较少。
        ai_chance: 55
        effect:
          - add_stability: 2
          - add_faction_influence: { nobles: 2 }

  # ── 日本 ───────────────────────────────────────────────────────
  - id: JAPAN_e_currency
    title: 幕藩财政
    desc: 幕府财政紧张，改铸货币能解燃眉之急，却会引发通胀。
