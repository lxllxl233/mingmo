events:
  # ══ 大明 · 甲申 ══════════════════════════════════════
  - id: MING_e_jiashen_1
    title: 北京告急
    desc: 李自成在西安称帝，随即东渡黄河，兵锋直指京师。京营缺饷，九门戒严。
    historical_context: 崇祯十七年正月，大顺军东征，明廷在战、守、迁之间摇摆。
    scope: country
    country: MING
    chain: MING_chain_jiashen
    trigger:
      all:
        - date: { after: 1644-02-01, before: 1644-04-30 }
        - not_has_flag: jiashen_started
    fire_once: true
    options:
      - id: summon_wu
        name: 调吴三桂入卫
        tooltip: 放弃关外，勤王京师。山海关防务空虚。
        ai_chance: 40
        effect:
          - set_flag: jiashen_started
          - set_flag: wu_sangui_summoned
          - add_treasury: -200000
          - add_stability: 3
          - spawn_army: { province: beijing, template: guanning_army, size: 3 }
          - trigger_event: { id: MING_e_jiashen_2, delay_days: 10 }
      - id: move_south
        name: 南迁
        tooltip: 弃京师，退保南京。天命与民心大损，但社稷可续。
        ai_chance: 20
        effect:
          - set_flag: jiashen_started
          - set_flag: capital_moved
          - add_stability: -15
          - add_mandate: -20
          - change_capital: nanjing
          - trigger_event: { id: MING_e_jiashen_2, delay_days: 20 }
      - id: hold
        name: 死守京师
        tooltip: 天子守国门。城破则社稷倾覆。
        ai_chance: 40
        effect:
          - set_flag: jiashen_started
          - set_flag: beijing_last_stand
          - add_stability: 10
          - add_mandate: 5
          - trigger_event: { id: MING_e_jiashen_2, delay_days: 20 }

  - id: MING_e_jiashen_2
    title: 山海关
    desc: 关外八旗按兵不动，关内大顺军已至。吴三桂的抉择，决定天下归谁。
    scope: country
    country: MING
    chain: MING_chain_jiashen
    trigger:
      all:
        - has_flag: jiashen_started
        - date: { after: 1644-03-01, before: 1644-05-31 }
    fire_once: true
    options:
      - id: open_to_qing
        name: 许吴三桂开关
        ai_chance: 45
        effect:
          - set_flag: wu_sangui_defected
          - add_stability: -10
          - add_mandate: -10
          - change_owner: { province: shanhaiguan, to: QING }
          - trigger_event: { id: MING_e_jiashen_3, delay_days: 15 }
      - id: order_hold
        name: 严令据守
        ai_chance: 55
        effect:
          - set_flag: shanhaiguan_held
          - add_treasury: -50000
          - add_army_loyalty: 3
          - trigger_event: { id: MING_e_jiashen_3, delay_days: 30 }

  - id: MING_e_jiashen_3
    title: 甲申之变
    desc: 京师城防已破，宫中火起。是死社稷，还是南渡？
    scope: country
    country: MING
    chain: MING_chain_jiashen
    trigger:
      all:
        - has_flag: jiashen_started
        - date: { after: 1644-04-01, before: 1644-06-30 }
    fire_once: true
    options:
      - id: die
        name: 死社稷
        ai_chance: 50
        effect:
          - set_flag: jiashen_resolved
          - set_flag: capital_fallen
          - add_stability: -20
          - add_mandate: -30
          - change_owner: { province: beijing, to: SHUN }
          - add_treasury: -300000
      - id: flee
        name: 南渡
        ai_chance: 50
        effect:
          - set_flag: jiashen_resolved
          - set_flag: capital_moved
          - add_stability: -8
          - add_mandate: -15
          - change_capital: nanjing
          - change_owner: { province: beijing, to: SHUN }

  # ══ 大清 · 入关 ══════════════════════════════════════
  - id: QING_e_entry_1
    title: 皇太极驾崩
    desc: 盛京宫中，皇太极暴卒。多尔衮与豪格各拥兵，继位之争一触即发。
    historical_context: 1643 年皇太极去世，多尔衮摄政，清廷完成权力交接。
    scope: country
    country: QING
    chain: QING_chain_entry
    trigger:
      all:
        - date: { after: 1643-08-01, before: 1643-12-31 }
        - not_has_flag: qing_succession
    fire_once: true
    options:
      - id: dorgon
        name: 多尔衮摄政
        ai_chance: 65
        effect:
          - set_flag: qing_succession
          - set_flag: dorgon_regent
          - add_stability: 5
          - add_authority: 5
          - trigger_event: { id: QING_e_entry_2, delay_days: 30 }
      - id: haoge
        name: 豪格争位
        ai_chance: 35
        effect:
          - set_flag: qing_succession
          - set_flag: haoge_khan
          - add_stability: -8
          - add_authority: -5
          - trigger_event: { id: QING_e_entry_2, delay_days: 30 }

  - id: QING_e_entry_2
    title: 吴三桂请兵
    desc: 山海关总兵吴三桂遣使乞师，愿以关内之地相酬。
    scope: country
    country: QING
    chain: QING_chain_entry
    trigger:
      all:
        - has_flag: qing_succession
        - date: { after: 1644-03-01, before: 1644-05-31 }
    fire_once: true
    options:
      - id: enter
        name: 倾国入关
        ai_chance: 70
        effect:
          - set_flag: qing_entered
          - add_treasury: -100000
          - spawn_army: { province: shanhaiguan, template: qing_banner, size: 2 }
          - trigger_event: { id: QING_e_entry_3, delay_days: 20 }
      - id: wait
        name: 坐观成败
        ai_chance: 30
        effect:
          - set_flag: qing_waited
          - add_stability: 3
          - trigger_event: { id: QING_e_entry_3, delay_days: 60 }

  - id: QING_e_entry_3
    title: 定鼎北京
    desc: 北京已下，紫禁城空。摄政王问：是为崇祯复仇，还是直接南下？
    scope: country
    country: QING
    chain: QING_chain_entry
    trigger:
      all:
        - any: [{ has_flag: qing_entered }, { has_flag: qing_waited }]
        - date: { after: 1644-05-01, before: 1644-08-31 }
    fire_once: true
    options:
      - id: revenge
        name: 为崇祯复仇
        ai_chance: 55
        effect:
          - set_flag: qing_legitimacy
          - add_mandate: 10
          - add_stability: 5
          - change_owner: { province: beijing, to: QING }
      - id: conquer
        name: 直接南下
        ai_chance: 45
        effect:
          - set_flag: qing_conquest
          - add_mandate: 3
          - add_modifier: { unrest_monthly: 0.5 }
          - change_owner: { province: beijing, to: QING }
          - add_treasury: -100000

  # ══ 大顺 · 东征 ══════════════════════════════════════
  - id: SHUN_e_east_1
    title: 西安称帝
    desc: 李自成在西安称大顺皇帝，改元永昌。诸将劝其乘胜东征。
    historical_context: 1644 年正月，李自成在西安建立大顺政权。
    scope: country
    country: SHUN
    chain: SHUN_chain_east
    trigger:
      all:
        - date: { after: 1644-01-01, before: 1644-02-28 }
        - not_has_flag: shun_emperor
    fire_once: true
    options:
      - id: east
        name: 渡河东征
        ai_chance: 70
        effect:
          - set_flag: shun_emperor
          - set_flag: shun_eastward
          - add_stability: 5
          - add_mandate: 10
          - trigger_event: { id: SHUN_e_east_2, delay_days: 15 }
      - id: consolidate
        name: 先固关中
        ai_chance: 30
        effect:
          - set_flag: shun_emperor
          - add_stability: 8
          - add_treasury: 100000
          - trigger_event: { id: SHUN_e_east_2, delay_days: 60 }

  - id: SHUN_e_east_2
    title: 渡河
    desc: 大顺军渡黄河，破太原，直逼宁武关。明军望风而降者众。
    scope: country
    country: SHUN
    chain: SHUN_chain_east
    trigger:
      all:
        - has_flag: shun_emperor
        - date: { after: 1644-02-01, before: 1644-03-31 }
    fire_once: true
    options:
      - id: speed
        name: 轻骑急进
        ai_chance: 60
        effect:
          - set_flag: shun_speed
          - add_treasury: -50000
          - add_stability: -3
          - trigger_event: { id: SHUN_e_east_3, delay_days: 10 }
      - id: slow
        name: 稳扎稳打
        ai_chance: 40
        effect:
          - set_flag: shun_slow
          - add_treasury: -100000
          - add_stability: 3
          - trigger_event: { id: SHUN_e_east_3, delay_days: 30 }

  - id: SHUN_e_east_3
    title: 北京城下
    desc: 京师已在眼前。是招降崇祯，还是强攻？
    scope: country
    country: SHUN
    chain: SHUN_chain_east
    trigger:
      all:
        - any: [{ has_flag: shun_speed }, { has_flag: shun_slow }]
        - date: { after: 1644-03-01, before: 1644-05-31 }
    fire_once: true
    options:
      - id: negotiate
        name: 遣使招降
        ai_chance: 35
        effect:
          - set_flag: shun_negotiated
          - add_stability: 3
          - add_treasury: -30000
          - change_owner: { province: beijing, to: SHUN }
      - id: assault
        name: 强攻北京
        ai_chance: 65
        effect:
          - set_flag: shun_took_beijing
          - add_stability: -5
          - add_treasury: -50000
          - change_owner: { province: beijing, to: SHUN }
          - add_modifier: { unrest_monthly: 0.4 }

  # ══ 大西 · 四川 ══════════════════════════════════════
  - id: XI_e_sichuan_1
    title: 入成都
    desc: 张献忠率大西军入川，攻破成都。蜀王被执，全川震动。
    scope: country
    country: XI
    chain: XI_chain_sichuan
    trigger:
      all:
        - date: { after: 1644-06-01, before: 1644-10-31 }
        - not_has_flag: xi_chengdu
    fire_once: true
    options:
      - id: occupy
        name: 据城立威
        ai_chance: 60
        effect:
          - set_flag: xi_chengdu
          - add_stability: 3
          - add_treasury: 100000
          - trigger_event: { id: XI_e_sichuan_2, delay_days: 20 }
      - id: appease
        name: 安抚蜀人
        ai_chance: 40
        effect:
          - set_flag: xi_chengdu
          - set_flag: xi_appease
          - add_stability: 8
          - add_estate_loyalty: { estate: gentry, value: 5 }
          - trigger_event: { id: XI_e_sichuan_2, delay_days: 30 }

  - id: XI_e_sichuan_2
    title: 大西称帝
    desc: 张献忠在成都称帝，国号大西。诸将请开科取士，以安蜀人。
    scope: country
    country: XI
    chain: XI_chain_sichuan
    trigger:
      all:
        - has_flag: xi_chengdu
        - date: { after: 1644-10-01, before: 1645-02-28 }
    fire_once: true
    options:
      - id: exam
        name: 开科取士
        ai_chance: 40
        effect:
          - set_flag: xi_emperor
          - add_stability: 6
          - add_estate_loyalty: { estate: gentry, value: 8 }
          - trigger_event: { id: XI_e_sichuan_3, delay_days: 30 }
      - id: terror
        name: 以杀立威
        ai_chance: 60
        effect:
          - set_flag: xi_emperor
          - set_flag: xi_terror
          - add_stability: -5
          - add_estate_loyalty: { estate: gentry, value: -15 }
          - add_modifier: { unrest_monthly: 0.6 }
          - trigger_event: { id: XI_e_sichuan_3, delay_days: 20 }

  - id: XI_e_sichuan_3
    title: 粮尽
    desc: 川中残破，粮道断绝。清军自北而来，南明自东而来。
    scope: country
    country: XI
    chain: XI_chain_sichuan
    trigger:
      all:
        - has_flag: xi_emperor
        - date: { after: 1645-01-01, before: 1646-12-31 }
    fire_once: true
    options:
      - id: ally_ming
        name: 联明抗清
        ai_chance: 45
        effect:
          - set_flag: xi_ally_ming
          - add_relation: { target: SMING, value: 30 }
          - add_treasury: -50000
          - add_stability: 3
      - id: fight
        name: 独立支撑
        ai_chance: 55
        effect:
          - set_flag: xi_alone
          - add_manpower: 10000
          - add_stability: -5
          - add_modifier: { army_attack_pct: 3 }

  # ══ 南明 · 继统 ══════════════════════════════════════
  - id: SMING_e_legit_1
    title: 南京议立
    desc: 崇祯殉国，南京诸臣议立新君。福王、潞王各有拥戴者。
    historical_context: 1644 年南京拥立福王朱由崧，弘光朝廷建立，随即陷入党争。
    scope: country
    country: SMING
    chain: SMING_chain_legit
    trigger:
      all:
        - date: { after: 1644-04-01, before: 1644-06-30 }
        - not_has_flag: sming_founded
    fire_once: true
    options:
      - id: fuwang
        name: 立福王
        ai_chance: 55
        effect:
          - set_flag: sming_founded
          - set_flag: fuwang_emperor
          - add_stability: 5
          - add_faction_influence: { donglin: -5, military: 5 }
          - trigger_event: { id: SMING_e_legit_2, delay_days: 20 }
      - id: luwang
        name: 立潞王
        ai_chance: 45
        effect:
          - set_flag: sming_founded
          - set_flag: luwang_emperor
          - add_stability: 2
          - add_faction_influence: { donglin: 8, military: -5 }
          - trigger_event: { id: SMING_e_legit_2, delay_days: 20 }

  - id: SMING_e_legit_2
    title: 弘光朝廷
    desc: 新君登基，马士英与史可法争权。江北四镇拥兵索饷。
    scope: country
    country: SMING
    chain: SMING_chain_legit
    trigger:
      all:
        - has_flag: sming_founded
        - date: { after: 1644-06-01, before: 1644-09-30 }
    fire_once: true
    options:
      - id: back_shi
        name: 倚重史可法
        ai_chance: 50
        effect:
          - set_flag: shi_kefa
          - add_stability: 6
          - add_estate_loyalty: { estate: gentry, value: 5 }
          - trigger_event: { id: SMING_e_legit_3, delay_days: 30 }
      - id: back_ma
        name: 倚重马士英
        ai_chance: 50
        effect:
          - set_flag: ma_shiying
          - add_corruption: 5
          - add_faction_influence: { military: 8, donglin: -8 }
          - trigger_event: { id: SMING_e_legit_3, delay_days: 30 }

  - id: SMING_e_legit_3
    title: 江北四镇
    desc: 四镇总兵各拥兵数万，索饷不已。朝廷无银，唯有加派。
    scope: country
    country: SMING
    chain: SMING_chain_legit
    trigger:
      all:
        - has_flag: sming_founded
        - date: { after: 1644-09-01, before: 1645-03-31 }
    fire_once: true
    options:
      - id: pay
        name: 加派养兵
        ai_chance: 55
        effect:
          - set_flag: sming_four_towns
          - add_treasury: -100000
          - add_estate_loyalty: { estate: peasants, value: -8 }
          - add_army_loyalty: 5
      - id: curb
        name: 裁抑藩镇
        ai_chance: 45
        effect:
          - set_flag: sming_curb_warlords
          - add_stability: -5
          - add_army_loyalty: -8
          - add_modifier: { army_defense_pct: 3 }

  # ══ 郑氏 · 取台 ══════════════════════════════════════
  - id: ZHENG_e_taiwan_1
    title: 金门决策
    desc: 南京败后，郑成功退守金厦。诸将议：北伐不成，可否东取台湾？
    historical_context: 1659 年郑成功南京失利，转而筹划取台湾作为抗清基地。
    scope: country
    country: ZHENG
    chain: ZHENG_chain_taiwan
    trigger:
      all:
        - date: { after: 1659-01-01, before: 1660-12-31 }
        - not_has_flag: zheng_taiwan_plan
    fire_once: true
    options:
      - id: go
        name: 东取台湾
        ai_chance: 65
        effect:
          - set_flag: zheng_taiwan_plan
          - set_flag: zheng_east
          - add_treasury: -100000
          - add_stability: 5
          - trigger_event: { id: ZHENG_e_taiwan_2, delay_days: 30 }
      - id: stay
        name: 固守金厦
        ai_chance: 35
        effect:
          - set_flag: zheng_taiwan_plan
          - add_stability: 3
          - add_modifier: { naval_attack_pct: 5 }
          - trigger_event: { id: ZHENG_e_taiwan_2, delay_days: 60 }

  - id: ZHENG_e_taiwan_2
    title: 鹿耳门
    desc: 郑军舰队乘潮入鹿耳门，荷兰人据热兰遮城固守。
    scope: country
    country: ZHENG
    chain: ZHENG_chain_taiwan
    trigger:
      all:
        - has_flag: zheng_taiwan_plan
        - date: { after: 1661-03-01, before: 1661-06-30 }
    fire_once: true
    options:
      - id: siege
        name: 围城
        ai_chance: 60
        effect:
          - set_flag: zheng_siege
          - add_treasury: -50000
          - spawn_army: { province: anping, template: zheng_marines, size: 2 }
          - trigger_event: { id: ZHENG_e_taiwan_3, delay_days: 30 }
      - id: assault
        name: 强攻
        ai_chance: 40
        effect:
          - set_flag: zheng_assault
          - add_treasury: -80000
          - add_army_loyalty: -3
          - trigger_event: { id: ZHENG_e_taiwan_3, delay_days: 20 }

  - id: ZHENG_e_taiwan_3
    title: 热兰遮
    desc: 荷兰守军粮尽，举城投降。台湾第一次成为汉人政权的大本营。
    scope: country
    country: ZHENG
    chain: ZHENG_chain_taiwan
    trigger:
      all:
        - any: [{ has_flag: zheng_siege }, { has_flag: zheng_assault }]
        - date: { after: 1661-06-01, before: 1662-06-30 }
    fire_once: true
    options:
      - id: lenient
        name: 允其体面撤走
        ai_chance: 50
        effect:
          - set_flag: zheng_taiwan
          - add_stability: 8
          - add_treasury: 50000
          - change_owner: { province: anping, to: ZHENG }
      - id: harsh
        name: 没收公司财产
        ai_chance: 50
        effect:
          - set_flag: zheng_taiwan
          - add_treasury: 150000
          - add_stability: -3
          - change_owner: { province: anping, to: ZHENG }

  # ══ 蒙古 · 林丹汗 ════════════════════════════════════
  - id: MONGOL_e_lin_1
    title: 察哈尔西迁
    desc: 林丹汗不敌后金，率部西迁。部众饥疲，诸部离心。
    historical_context: 1632 年后林丹汗西迁青海，察哈尔蒙古走向瓦解。
    scope: country
    country: MONGOL
    chain: MONGOL_chain_lin
    trigger:
      all:
        - date: { after: 1632-01-01, before: 1635-12-31 }
        - not_has_flag: mongol_westward
    fire_once: true
    options:
      - id: west
        name: 继续西迁
        ai_chance: 60
        effect:
          - set_flag: mongol_westward
          - add_treasury: -50000
          - add_stability: -5
          - trigger_event: { id: MONGOL_e_lin_2, delay_days: 60 }
      - id: fight
        name: 回头决战
        ai_chance: 40
        effect:
          - set_flag: mongol_westward
          - add_manpower: 10000
          - add_stability: 3
          - trigger_event: { id: MONGOL_e_lin_2, delay_days: 30 }

  - id: MONGOL_e_lin_2
    title: 传国玉玺
    desc: 林丹汗病卒，其子额哲献传国玉玺于后金。草原的合法性易主。
    historical_context: 1635 年额哲降金，传国玉玺归皇太极，为称帝提供依据。
    scope: country
    country: MONGOL
    chain: MONGOL_chain_lin
    trigger:
      all:
        - has_flag: mongol_westward
        - date: { after: 1635-01-01, before: 1636-12-31 }
    fire_once: true
    options:
      - id: submit
        name: 归附后金
        ai_chance: 55
        effect:
          - set_flag: mongol_submit
          - add_stability: 5
