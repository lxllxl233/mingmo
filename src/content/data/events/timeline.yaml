events:
  # ── 大明 1627–1644 ─────────────────────────────────────────────
  - id: MING_e_jisi_crisis
    title: 己巳之变
    desc: 后金绕道蒙古破关而入，京师戒严。勤王军云集，却缺饷、缺统一指挥。
    historical_context: 1629 年皇太极绕开关宁防线入塞，崇祯急调各地勤王，袁崇焕下狱。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1629-11-01, before: 1630-06-30 }
    mtth: 90
    fire_once: true
    options:
      - id: mobilize
        name: 急调勤王
        tooltip: 稳住京师，但耗费国库、削弱边防。
        ai_chance: 55
        effect:
          - add_treasury: -50000
          - add_all_estate_loyalty: 2
          - add_faction_influence: { military: 4, donglin: -2 }
          - spawn_army: { province: beijing, template: guanning_army, size: 2 }
      - id: scorched
        name: 坚壁清野
        tooltip: 放弃关外粮道，保全京师；边军不满。
        ai_chance: 45
        effect:
          - add_treasury: -20000
          - add_all_estate_loyalty: -2
          - add_army_loyalty: 3
          - add_faction_influence: { military: 3 }

  - id: MING_e_kong_revolt
    title: 孔有德之叛
    desc: 登莱兵变，孔有德率部叛走。是招抚还是围剿，朝议争论不休。
    historical_context: 1631 年孔有德在吴桥兵变，后降后金，带去大量火器与工匠。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1631-06-01, before: 1633-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: pardon
        name: 招抚叛军
        tooltip: 花钱安抚，保住火器工匠；军纪受损。
        ai_chance: 50
        effect:
          - add_treasury: -40000
          - add_all_estate_loyalty: 1
          - add_faction_influence: { military: -2, donglin: 2 }
      - id: crush
        name: 武力镇压
        tooltip: 以大军围剿，耗银且损兵。
        ai_chance: 50
        effect:
          - add_treasury: -60000
          - add_manpower: -2000
          - add_all_estate_loyalty: -1
          - add_army_loyalty: -2

  - id: MING_e_songjin
    title: 松锦之战
    desc: 洪承畴被围松山，锦州告急。朝廷既怕丧师，又怕再次空耗国库。
    historical_context: 1640–1642 年松锦决战，明军主力覆没，洪承畴降清。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1640-01-01, before: 1642-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: relieve
        name: 全力救援
        tooltip: 调集九边精锐，赌一场决战。
        ai_chance: 50
        effect:
          - add_treasury: -100000
          - add_manpower: -5000
          - add_all_estate_loyalty: -2
          - add_army_loyalty: 3
      - id: preserve
        name: 保存实力
        tooltip: 放弃锦州，退守宁远；天命与军心受损。
        ai_chance: 50
        effect:
          - add_all_estate_loyalty: -4.25
          - add_army_loyalty: -3

  - id: MING_e_sun_chuanting
    title: 孙传庭出关
    desc: 孙传庭在潼关练兵未成，朝廷却催他出关决战。催战可能丧师，固守又违旨。
    historical_context: 1643 年孙传庭被迫出关，兵败潼关，关中门户洞开。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1643-01-01, before: 1644-01-31 }
    mtth: 90
    fire_once: true
    options:
      - id: push
        name: 催战出关
        tooltip: 迎合朝议，短期皇权与军功可期，却埋下潼关失守的隐患。
        ai_chance: 55
        effect:
          - add_all_estate_loyalty: -4
          - add_army_loyalty: -4
          - add_faction_influence: { eunuch: 3, military: -3 }
          - set_flag: ming_tongguan_risk
      - id: hold
        name: 固守潼关
        tooltip: 抗旨固守，花钱换时间，练兵有成后潼关可保。
        ai_chance: 45
        effect:
          - add_treasury: -30000
          - add_all_estate_loyalty: 1
          - add_army_loyalty: 2
          - add_faction_influence: { military: 4, eunuch: -3 }
          - set_flag: ming_tongguan_held

  # 孙传庭出关的长期后果：催战 → 潼关失守（关中门户洞开）；固守 → 潼关稳固（练兵有成）。
  - id: MING_e_tongguan_fallen
    title: 潼关失守
    desc: 孙传庭兵败身死，潼关陷落，关中门户洞开，闯军长驱直入。
    historical_context: 1643 年孙传庭在郏县大败，潼关旋失，李自成随即入据西安。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1644-01-01, before: 1646-12-31 }
        - has_flag: ming_tongguan_risk
    mtth: 200
    fire_once: true
    options:
      - id: flee
        name: 收缩防线
        tooltip: 关中失守，朝廷震动，兵源与天命大损。
        ai_chance: 60
        effect:
          - add_all_estate_loyalty: -7
          - add_manpower: -20000
          - add_army_loyalty: -5
      - id: counter
        name: 调京营反扑
        tooltip: 耗银调兵，挽回颓势，但京畿空虚。
        ai_chance: 40
        effect:
          - add_treasury: -50000
          - add_manpower: -15000
          - add_all_estate_loyalty: -3.75

  - id: MING_e_tongguan_held
    title: 潼关稳固
    desc: 孙传庭固守潼关，练兵渐成，闯军屡攻不克。关中的屏障保住了。
    historical_context: 若孙传庭得以固守，潼关可阻李自成入陕，明朝国祚或可稍延。
    scope: country
    country: MING
    trigger:
      all:
        - date: { after: 1644-01-01, before: 1646-12-31 }
        - has_flag: ming_tongguan_held
    mtth: 200
    fire_once: true
    options:
      - id: press
        name: 趁势练兵
        tooltip: 潼关稳固，兵源与军心回升。
        ai_chance: 60
        effect:
          - add_all_estate_loyalty: 3
          - add_army_loyalty: 4
          - add_manpower: 15000
      - id: reward
        name: 犒赏将士
        tooltip: 破财犒军，军心大振，稳定略升。
        ai_chance: 40
        effect:
          - add_treasury: -30000
          - add_army_loyalty: 6
          - add_all_estate_loyalty: 2

  # ── 大清 1627–1645 ─────────────────────────────────────────────
  - id: QING_e_han_banners
    title: 编汉军旗
    desc: 汉军旗与绿营的数量已超过满洲旗丁。扩编能补兵源，却会改变八旗的成色。
    historical_context: 皇太极编立汉军八旗，吸收汉人火器与官僚，为入关做准备。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1631-01-01, before: 1644-01-31 }
    mtth: 150
    fire_once: true
    options:
      - id: expand_han
        name: 扩编汉军
        tooltip: 兵源增加，汉臣支持；满洲旧贵不满。
        ai_chance: 55
        effect:
          - add_manpower: 3000
          - add_treasury: -30000
          - add_faction_influence: { han_official: 5, manchu: -2 }
      - id: keep_manchu
        name: 保持满洲旧制
        tooltip: 八旗与满洲旗分支持上升。
        ai_chance: 45
        effect:
          - add_faction_influence: { banners: 5, han_official: -3 }
          - add_all_estate_loyalty: 1
          - add_army_loyalty: 2

  - id: QING_e_songjin_surrender
    title: 松锦受降
    desc: 洪承畴、祖大寿等明将降清。厚待能招徕更多汉官，严惩能立威。
    historical_context: 松锦之战后，大批明军将领降清，成为入关先锋。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1642-01-01, before: 1645-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: treat_well
        name: 厚待降将
        tooltip: 汉臣与绿营支持上升，但耗费银两。
        ai_chance: 60
        effect:
          - add_treasury: -30000
          - add_faction_influence: { han_official: 6, green_standard: 4 }
          - add_manpower: 2000
      - id: punish
        name: 立威严惩
        tooltip: 军心上升，汉臣寒心。
        ai_chance: 40
        effect:
          - add_army_loyalty: 3
          - add_faction_influence: { han_official: -4, banners: 3 }

  - id: QING_e_dorgon_regency
    title: 多尔衮摄政
    desc: 顺治年幼，多尔衮以摄政王身份总揽朝政。支持摄政还是恢复议政王大臣共治？
    historical_context: 1643 年多尔衮摄政，随后率军入关，权力达到顶峰。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1643-01-01, before: 1646-12-31 }
    mtth: 90
    fire_once: true
    options:
      - id: support_regent
        name: 支持摄政
        tooltip: 皇权集中，八旗支持；宗室不满。
        ai_chance: 55
        effect:
          - add_all_estate_loyalty: 1.5
          - add_faction_influence: { banners: 4, imperial: -3 }
      - id: council
        name: 议政王大臣共治
        tooltip: 宗室支持，决策更慢。
        ai_chance: 45
        effect:
          - add_faction_influence: { imperial: 4, banners: -2 }
          - add_all_estate_loyalty: 1

  - id: QING_e_haircut
    title: 剃发令
    desc: 入关后推行剃发易服。厉行能立威，却会激起江南反抗；缓行能安抚，却损征服者威信。
    historical_context: 1645 年清廷下剃发令，江南爆发大规模抗清。
    scope: country
    country: QING
    trigger:
      all:
        - date: { after: 1645-06-01, before: 1648-12-31 }
    mtth: 100
    fire_once: true
    options:
      - id: enforce
        name: 厉行剃发
        tooltip: 皇权与八旗支持上升，稳定下降。
        ai_chance: 55
        effect:
          - add_all_estate_loyalty: -2.5
          - add_faction_influence: { banners: 4, han_official: -3 }
      - id: delay
        name: 缓行安抚
        tooltip: 稳定与汉臣支持上升，正统受损。
        ai_chance: 45
        effect:
          - add_all_estate_loyalty: 1.5
          - add_faction_influence: { han_official: 3, banners: -2 }

  # ── 大顺 1640–1645 ─────────────────────────────────────────────
  - id: SHUN_e_land_to_peasants
    title: 均田免赋
    desc: 饥民要求分地，士绅要求保护田产。大顺必须在民心与粮饷之间取舍。
    historical_context: 李自成以“均田免赋”号召流民，进入河南后声势大振。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1640-01-01, before: 1644-12-31 }
    mtth: 120
    fire_once: true
    options:
      - id: redistribute
        name: 推行均田
        tooltip: 农民支持、粮食增加；士绅反弹。
        ai_chance: 55
        effect:
          - add_food: 80000
          - add_all_estate_loyalty: 2
          - add_faction_influence: { farmers: 8, gentry: -6 }
      - id: delay
        name: 暂缓分地
        tooltip: 士绅支持、得银；农民失望。
        ai_chance: 45
        effect:
          - add_treasury: 30000
          - add_faction_influence: { gentry: 5, farmers: -4 }

  - id: SHUN_e_xiangyang_court
    title: 襄阳建政
    desc: 大顺军占领襄阳，诸将请李自成称王建号。称王能立正统，也会成为明军靶子。
    historical_context: 1643 年李自成在襄阳称新顺王，建立政权机构。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1643-01-01, before: 1644-12-31 }
    mtth: 100
    fire_once: true
    options:
      - id: crown
        name: 称王建号
        tooltip: 正统与权威上升，武将支持。
        ai_chance: 55
        effect:
          - add_all_estate_loyalty: 2
          - add_faction_influence: { military: 4, farmers: 2 }
      - id: mobile
        name: 继续流动作战
        tooltip: 保持机动，稳定与正统受损。
        ai_chance: 45
        effect:
          - add_faction_influence: { military: 5 }
          - add_all_estate_loyalty: -2.5

  - id: SHUN_e_beijing_treasury
    title: 北京追赃
    desc: 大顺军入京，国库空虚，诸将主张拷掠勋戚与士绅。追赃能得巨银，却会毁掉民心。
    historical_context: 李自成入北京后追赃助饷，短期得银，士绅转而引清兵入关。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1644-04-01, before: 1645-12-31 }
    mtth: 60
    fire_once: true
    options:
      - id: extort
        name: 追赃助饷
        tooltip: 得银十万，士绅与稳定重创。
        ai_chance: 55
        effect:
          - add_treasury: 100000
          - add_all_estate_loyalty: -4
          - add_faction_influence: { military: 5, gentry: -8 }
      - id: restrain
        name: 约束军纪
        tooltip: 安抚士绅，军费更紧。
        ai_chance: 45
        effect:
          - add_treasury: -20000
          - add_all_estate_loyalty: 3
          - add_faction_influence: { gentry: 3, military: -2 }

  - id: SHUN_e_jiugong
    title: 九宫山
    desc: 大顺军退出北京后一路西撤，李自成在九宫山遇袭。亲征能聚拢军心，分兵能保存火种。
    historical_context: 1645 年李自成在湖北九宫山遇害，大顺余部后来联明抗清。
    scope: country
    country: SHUN
    trigger:
      all:
        - date: { after: 1645-01-01, before: 1646-12-31 }
    mtth: 90
    fire_once: true
    options:
      - id: campaign
        name: 亲征聚拢
        tooltip: 军心与兵源上升，稳定下降。
        ai_chance: 50
        effect:
          - add_manpower: 3000
          - add_army_loyalty: 3
          - add_all_estate_loyalty: -2
      - id: split
        name: 分兵保存
        tooltip: 稳定上升，兵力与武将支持下降。
        ai_chance: 50
        effect:
          - add_manpower: -2000
          - add_all_estate_loyalty: 1
          - add_faction_influence: { military: -3 }

  # ── 南明 1644–1652 ─────────────────────────────────────────────
  - id: SMING_e_hongguang
    title: 弘光登基
    desc: 北京陷落，南京诸臣拥立福王。拥立能快速立正统，廷议能安抚东林。
    historical_context: 1644 年马士英等拥立福王朱由崧，弘光政权建立。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1644-05-01, before: 1645-12-31 }
    mtth: 70
    fire_once: true
    options:
      - id: crown
        name: 拥立福王
        tooltip: 正统与宗室上升，东林不满。
        ai_chance: 55
        effect:
          - add_all_estate_loyalty: 1.25
          - add_treasury: -30000
          - add_faction_influence: { royal_clan: 5, donglin: -3 }
      - id: debate
        name: 廷议择君
        tooltip: 东林支持，正统提升较慢。
        ai_chance: 45
        effect:
          - add_faction_influence: { donglin: 5 }
          - add_all_estate_loyalty: 1.5

  - id: SMING_e_four_towns
    title: 江北四镇
    desc: 江北四镇拥兵自重，索取粮饷。笼络能稳住防线，整编能收回兵权但可能激变。
    historical_context: 弘光朝依赖江北四镇，军阀化严重，直接导致左良玉东下与扬州失守。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1644-06-01, before: 1645-06-30 }
    mtth: 80
    fire_once: true
    options:
      - id: buy_off
        name: 笼络四镇
        tooltip: 武将支持，军费与腐败上升。
        ai_chance: 55
        effect:
          - add_treasury: -40000
          - add_faction_influence: { military: 6 }
          - add_all_estate_loyalty: -1
      - id: reorganize
        name: 整编四镇
        tooltip: 稳定上升，武将不满。
        ai_chance: 45
        effect:
          - add_faction_influence: { military: -4 }
          - add_all_estate_loyalty: 2.5

  - id: SMING_e_longwu_zheng
    title: 隆武与郑氏
    desc: 隆武在福建依赖郑芝龙。倚郑能得海贸与军队，亲征能摆脱郑氏控制。
    historical_context: 1645 年隆武帝在福州即位，郑芝龙掌握实权，后降清。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1645-08-01, before: 1646-12-31 }
    mtth: 90
    fire_once: true
    options:
      - id: rely_zheng
        name: 倚重郑氏
        tooltip: 商人、武将支持，国库增收；宗室不满。
        ai_chance: 55
        effect:
          - add_treasury: 30000
          - add_faction_influence: { merchants: 5, military: 4, royal_clan: -2 }
      - id: campaign
        name: 亲征北伐
        tooltip: 正统与军心上升，耗费国库。
        ai_chance: 45
        effect:
          - add_all_estate_loyalty: 0.75
          - add_army_loyalty: 2
          - add_treasury: -50000

  - id: SMING_e_sun_li
    title: 孙李合流
    desc: 大西余部孙可望、李定国请求联明抗清。联合能得劲旅，分治能保正统。
    historical_context: 1652 年大西军与南明永历政权联合，李定国两蹶名王。
    scope: country
    country: SMING
    trigger:
      all:
        - date: { after: 1652-01-01, before: 1657-12-31 }
    mtth: 80
    fire_once: true
    options:
      - id: unite
        name: 联合大西
        tooltip: 兵源与武将支持上升，稳定下降。
        ai_chance: 55
        effect:
          - add_manpower: 5000
          - add_faction_influence: { military: 5 }
          - add_all_estate_loyalty: -1
      - id: separate
        name: 保持距离
        tooltip: 稳定上升，军力与正统受损。
        ai_chance: 45
        effect:
          - add_all_estate_loyalty: 1
          - add_faction_influence: { military: -3 }
          - add_all_estate_loyalty: -0.5

  # ── 郑氏 1633–1661 ─────────────────────────────────────────────
  - id: ZHENG_e_liaoluo
    title: 料罗湾海战
    desc: 荷兰舰队与刘香联军进逼，郑芝龙必须决定是否正面迎战。
    historical_context: 1633 年郑芝龙在料罗湾击败荷兰与海盗联军，确立东南海权。
    scope: country
    country: ZHENG
    trigger:
      all:
        - date: { after: 1633-01-01, before: 1635-12-31 }
    mtth: 100
    fire_once: true
    options:
      - id: fight
        name: 正面迎战
        tooltip: 得银与军心，损失部分舰队。
        ai_chance: 55
        effect:
          - add_treasury: 30000
          - add_faction_influence: { military: 4, merchants: 2 }
          - add_army_loyalty: 2
