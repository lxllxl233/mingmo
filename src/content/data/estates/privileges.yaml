    name: 宗禄
    desc: 宗室岁支禄米，世袭罔替。藩府富可敌国，太仓为之一空。
    effects:
      - add_modifier: { tax_efficiency_pct: -6 }
    revoke:
      cost: { political_power: 100 }
      effects:
        - add_estate_loyalty: { estate: ruling, value: -25 }
