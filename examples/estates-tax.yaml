    ai_keep: 70

  - id: priv_clan_manor
    estate: dynasty
    name: 藩府庄田
    desc: 藩王就封，赐田动辄万顷。
    effects:
      - add_modifier: { food_output_pct: -3 }
    revoke:
      cost: { political_power: 120 }
      effects:
        - add_estate_loyalty: { estate: dynasty, value: -20 }
