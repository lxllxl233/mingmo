  - id: priv_merchant_salt_license
    estate: merchants
    name: 盐引世袭
    desc: 纲商世袭盐引，垄断盐利。
    effects:
      - add_modifier: { trade_efficiency_pct: 5 }
    revoke:
      cost: { political_power: 60 }
      effects:
        - add_estate_loyalty: { estate: merchants, value: -18 }
        - add_modifier: { trade_efficiency_pct: -8 }
    ai_keep: 55

  - id: priv_soldier_land
    estate: soldiers
    name: 军田
    desc: 军户授田，且耕且守，免其杂差。
    effects:
      - add_modifier: { army_upkeep_pct: -10 }
    revoke:
      cost: { political_power: 50 }
      effects:
        - add_estate_loyalty: { estate: soldiers, value: -15 }
        - add_modifier: { army_upkeep_pct: 10 }
    ai_keep: 60

  - id: priv_banner_land
    estate: nobles
    name: 旗地
    desc: 八旗圈地，旗人食租，汉民失田。
    effects:
      - add_modifier: { army_upkeep_pct: -8 }
      - add_modifier: { unrest_monthly: 0.2 }
    revoke:
      cost: { political_power: 120 }
      effects:
        - add_estate_loyalty: { estate: nobles, value: -30 }
        - add_estate_loyalty: { estate: soldiers, value: -20 }
        - add_modifier: { unrest_monthly: -0.3 }
    ai_keep: 80

  - id: priv_clergy_exempt
    estate: clergy
    name: 寺观免科
    desc: 寺院田产不纳粮、不当差。
    effects:
      - add_modifier: { tax_efficiency_pct: -3 }
    revoke:
      cost: { political_power: 70 }
      effects:
        - add_estate_loyalty: { estate: clergy, value: -25 }
        - add_mandate: -5
        - add_modifier: { tax_efficiency_pct: 3 }
    ai_keep: 45
