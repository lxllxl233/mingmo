# 阶级与税法（fixture，明 / 清完整，另附 20 条通用税法）
# 规范见 prompts/02-content-spec.md 第 8 节。
# 这份文件是 M1 的验收基准：income_share 之和必须为 1，每条税法必须能落到某个启用阶级。

