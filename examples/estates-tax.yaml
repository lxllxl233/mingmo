    ai_keep: 65

  - id: priv_official_meltage
    estate: officials
    name: 火耗陋规
    desc: 征税有火耗，解运有羡余，皆为官吏私入。
    effects:
      - add_modifier: { tax_efficiency_pct: -5 }
    revoke:
      cost: { political_power: 60 }
      effects:
        - add_estate_loyalty: { estate: officials, value: -15 }
        - add_modifier: { corruption_add: -0.2 }
    ai_keep: 55

  - id: priv_gentry_corvee_exempt
    estate: gentry
    name: 优免差徭
    desc: 有功名者免徭役，投献成风，田亩多挂绅衿名下。
    effects:
      - add_modifier: { tax_efficiency_pct: -4 }
    revoke:
      cost: { political_power: 80 }
      effects:
        - add_estate_loyalty: { estate: gentry, value: -20 }
        - add_stability: -5
        - add_modifier: { tax_efficiency_pct: 4 }
    ai_keep: 60

  - id: priv_gentry_hidden_land
    estate: gentry
    name: 诡寄飞洒
    desc: 田亩诡寄他户，飞洒税粮于贫民。
    effects:
