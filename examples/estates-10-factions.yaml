tax_laws:

  - id: tax_warlord_retinue
    estate: nobles
    name: 将领食邑
    desc: 以战养兵，将领各食其邑。兵为将有，朝廷但受其名。
    rate: 0.03
    efficiency: 0.55
    evasion_base: 0.25
    silver_share: 0.5
    loyalty_drift: 0.2
    influence_shift: 5
    effects:
      - add_modifier: { army_attack_pct: 5 }
    ai_weight: 55

  - id: tax_mongol_khan
    estate: dynasty
    name: 部民贡赋
    desc: 汗室按部征马牛羊，随水草而居。贡无定额，亦无定所。
    rate: 0.02
    efficiency: 0.5
    evasion_base: 0.25
    silver_share: 0.1
    loyalty_drift: 0.3
    influence_shift: 3
    effects:
      - add_modifier: { cavalry_attack_pct: 3 }
    ai_weight: 55

  - id: tax_tibet_khan
    estate: dynasty
    name: 乌拉差役
    desc: 以差役代赋，寺院与贵族各领其民。政令不出拉萨。
    rate: 0.02
    efficiency: 0.45
    evasion_base: 0.3
    silver_share: 0.3
    loyalty_drift: 0.2
    influence_shift: 3
    effects:
      - add_modifier: { stability_monthly: 0.05 }
    ai_weight: 50

  - id: tax_shun_confiscation
    estate: gentry
    name: 追赃助饷
    desc: 拷掠缙绅，勒令输银。得银甚速，然士绅视大顺如寇仇。
    rate: 0.15
    efficiency: 0.5
    evasion_base: 0.3
    silver_share: 1.0
    loyalty_drift: -4.0
    influence_shift: -10
    incidence: { estate: peasants, factor: 0.1 }
    effects:
      - add_modifier: { unrest_add: 1.0 }
      - add_modifier: { corruption_add: 0.2 }
    ai_weight: 60

  - id: tax_shun_land_equal
    estate: peasants
    name: 均田免赋
    desc: 迎闯王，不纳粮。得民心于一时，然无赋则无饷，无饷则无兵。
    rate: 0.01
    efficiency: 0.5
    evasion_base: 0.2
    silver_share: 0.2
    loyalty_drift: 2.0
    influence_shift: 5
    effects:
      - add_modifier: { manpower_add: 15000 }
      - add_modifier: { tax_efficiency_pct: -5 }
    ai_weight: 55

  - id: tax_xi_terror
    estate: gentry
    name: 屠掠
    desc: 以刀索财。士绅尽室而逃，蜀中千里无人。
    rate: 0.20
    efficiency: 0.4
    evasion_base: 0.35
    silver_share: 1.0
    loyalty_drift: -6.0
    influence_shift: -20
    effects:
      - add_modifier: { unrest_add: 2.0 }
      - add_modifier: { pop_growth_pct: -3 }
    ai_weight: 50

  - id: tax_xi_forced_levy
    estate: peasants
    name: 括粮
    desc: 按户搜粮，颗粒不留。军食足而民尽为盗。
    rate: 0.12
    efficiency: 0.35
    evasion_base: 0.4
    silver_share: 0.6
    loyalty_drift: -5.0
    influence_shift: -10
    effects:
      - add_modifier: { food_output_pct: -15 }
    ai_weight: 55

  - id: tax_zheng_sea_tithe
    estate: merchants
    name: 海贸抽分
    desc: 以厦门、台湾为枢纽，抽东西洋商船之利。银货辐辏，而清廷之海禁如影随形。
    rate: 0.10
    efficiency: 0.8
    evasion_base: 0.15
    silver_share: 1.0
    loyalty_drift: 0.5
    influence_shift: 5
    require:
      any:
        - controls: xiamen
        - controls: anping
    effects:
      - add_modifier: { trade_efficiency_pct: 20 }
    ai_weight: 70

  - id: tax_mongol_herd
    estate: nobles
    name: 牧丁
    desc: 台吉按部民征马牛羊。随水草而迁，税无定所。
    rate: 0.03
    efficiency: 0.6
    evasion_base: 0.2
    silver_share: 0.2
    loyalty_drift: -0.5
    influence_shift: 0
    effects:
      - add_modifier: { manpower_add: 6000, cavalry_attack_pct: 5 }
    ai_weight: 60

  - id: tax_japan_kokudaka
    estate: peasants
    name: 石高
    desc: 检地定石高，按石征年贡。米为本位，商贾另课。
    rate: 0.10
    efficiency: 0.8
    evasion_base: 0.1
    silver_share: 0.3
    loyalty_drift: -1.0
    influence_shift: 0
    effects:
      - add_modifier: { food_output_pct: 8 }
    ai_weight: 65

  - id: tax_joseon_daedong
    estate: peasants
    name: 大同法
    desc: 贡物折米，均役于田。两班之田亦在其中，故阻力极大。
    rate: 0.06
    efficiency: 0.7
    evasion_base: 0.15
    silver_share: 0.5
    loyalty_drift: 0
    influence_shift: -3
    effects:
      - add_modifier: { tax_efficiency_pct: 5 }
    ai_weight: 55

  - id: tax_tibet_caravan
    estate: merchants
    name: 茶马商道
    desc: 以茶易马，寺院抽分。商队所至，即政令所及。
    rate: 0.08
    efficiency: 0.6
    evasion_base: 0.25
    silver_share: 0.8
    loyalty_drift: 0
    influence_shift: 3
    effects:
      - add_modifier: { trade_efficiency_pct: 12 }
    ai_weight: 55

  - id: tax_voc_dividend
    estate: dynasty
    name: 股东分红
    desc: 十七人董事会坐收红利。巴达维亚的账房，比战舰更能决定远东的成败。
    rate: 0.02
    efficiency: 0.9
    evasion_base: 0.05
    silver_share: 1.0
    loyalty_drift: 0.5
    influence_shift: 5
    effects:
      - add_modifier: { trade_efficiency_pct: 10 }
    ai_weight: 70

  - id: tax_voc_trade
    estate: merchants
    name: 公司贸易
    desc: 垄断香料与丝瓷，以武装商船开道。利润即国力。
    rate: 0.10
    efficiency: 0.85
    evasion_base: 0.1
    silver_share: 1.0
    loyalty_drift: 0
    influence_shift: 0
    effects:
      - add_modifier: { naval_attack_pct: 10 }
    ai_weight: 70

  - id: tax_voc_plantation
    estate: custom:natives
    name: 强制种植
    desc: 令土著改种甘蔗香料，按丁征物。反抗者付之刀兵。
    rate: 0.15
    efficiency: 0.5
    evasion_base: 0.3
    silver_share: 0.9
    loyalty_drift: -3.0
    influence_shift: -5
    effects:
      - add_modifier: { unrest_add: 1.5 }
    ai_weight: 60

  - id: tax_russia_fur
    estate: merchants
    name: 毛皮税
    desc: 以貂皮代银，实为对西伯利亚的掠夺式征税。
    rate: 0.10
    efficiency: 0.7
    evasion_base: 0.2
    silver_share: 0.8
    loyalty_drift: 0
    influence_shift: 3
    effects:
      - add_modifier: { trade_efficiency_pct: 10 }
    ai_weight: 60

  - id: tax_russia_poll
    estate: peasants
    name: 人头税
    desc: 按丁纳银，农奴捆于土地。国库充盈，而彼得堡的阴影愈长。
    rate: 0.05
    efficiency: 0.6
    evasion_base: 0.2
    silver_share: 0.5
    loyalty_drift: -0.8
    influence_shift: 0
    effects:
      - add_modifier: { manpower_add: 5000 }
    ai_weight: 55
